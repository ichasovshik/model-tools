name: Convert TFLite to ONNX

on:
  workflow_dispatch:
  push:
    paths:
      - "inputs/**"
      - ".github/workflows/tflite_to_onnx.yml"

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show input file
        run: |
          ls -lah inputs
          file inputs/selfie_multiclass_256x256.tflite || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install conversion toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx==1.14.1 protobuf==3.20.3 numpy==1.26.4
          python -m pip install tflite==2.10.0 tflite2onnx==0.4.1
          python -m pip install onnxsim

      - name: Attempt conversion (tflite2onnx)
        run: |
          set -euxo pipefail
          mkdir -p outputs
          python -m tflite2onnx.convert \
            --input inputs/selfie_multiclass_256x256.tflite \
            --output outputs/selfie_multiclass_256x256.onnx
          ls -lah outputs

      - name: Simplify ONNX (optional)
        run: |
          set -euxo pipefail
          python -m onnxsim outputs/selfie_multiclass_256x256.onnx outputs/selfie_multiclass_256x256.sim.onnx || true
          ls -lah outputs

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: selfie_multiclass_256x256_onnx
          path: outputs/