name: Convert TFLite to ONNX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show input file
        run: |
          ls -lah inputs
          file inputs/selfie_multiclass_256x256.tflite || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2" onnx onnxsim

      - name: Install pinto0309/tflite2onnx
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/PINTO0309/tflite2onnx.git
          cd tflite2onnx
          python -m pip install -r requirements.txt
          python -m pip install .

      - name: Convert
        run: |
          set -euxo pipefail
          mkdir -p outputs
          python -m tflite2onnx \
            --input_path inputs/selfie_multiclass_256x256.tflite \
            --output_path outputs/selfie_multiclass_256x256.onnx

          ls -lah outputs
          test -f outputs/selfie_multiclass_256x256.onnx

      - name: Simplify ONNX (optional)
        run: |
          set -euxo pipefail
          python -m onnxsim outputs/selfie_multiclass_256x256.onnx outputs/selfie_multiclass_256x256.sim.onnx || true
          ls -lah outputs

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: selfie_multiclass_256x256_onnx
          path: outputs/_onnx
          path: outputs/
