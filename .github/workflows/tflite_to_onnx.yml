name: Convert TFLite to ONNX

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare outputs
        run: |
          set -euxo pipefail
          mkdir -p outputs
          echo "hello" > outputs/_sanity.txt
          ls -lah outputs

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: sanity_outputs
          path: outputs/
